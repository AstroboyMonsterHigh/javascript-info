<!DOCTYPE HTML>
<html>
    <head></head>
    <body>
        <h1>Variables</h1>
        <!-- https://javascript.info/variables -->
        
        <script>
            // declare variable with name
            let message;
            message = "Store owner says, Hello";
            alert(message);
            
            // declare variable with name and value
            let shoutout = "Shopper says, Hey";
            alert(shoutout);
            
            // declare multiple variable 1
            let shopper1 = "Joy", item1 = "lipstick", comment1 = "my fave";
            
            // declare multiple variable 2
            let shopper2 = "Dave";
            let item2 = "toys";
            let commment2 = "oh goodie";
            
            let $ = 1; // declared a variable with the name "$"
            let _ = 2; // and now a variable with the name "_"
            alert($ + _); // 3
            
        </script>
    </body>
</html>
